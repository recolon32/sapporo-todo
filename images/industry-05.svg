<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="札幌市は21大都市中、世帯年収(総世帯)21位・勤労者世帯21位・金融資産残高21位・純金融資産20位・1か月消費支出20位と所得・貯蓄・資産・消費がほぼ最下位。一方で高齢化率は14位(むしろ若い方)、世帯の小ささ(単身の多さ)は5位で世帯構成は平均的。単身・高齢では説明できず、要因は所得水準そのもの。" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif">
  <!-- self-contained light card so it is readable on any page theme -->
  <rect x="0" y="0" width="900" height="560" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="559" rx="10" fill="none" stroke="#e4e4e7" stroke-width="1"/>

  <text x="24" y="42" font-size="21" font-weight="700" fill="#1d1d1f">札幌市は21大都市中で何位？</text>
  <text x="24" y="66" font-size="13" fill="#6b6b70">所得・貯蓄・資産・消費はほぼ最下位。世帯構成（高齢・単身）は平均的。</text>

  <!-- axis ticks -->
  <text x="270" y="92" text-anchor="middle" font-size="11" fill="#6b6b70">1位（高い）</text>
  <text x="864" y="92" text-anchor="end" font-size="11" fill="#6b6b70">21位（最下位）</text>

  <!-- A 世帯年収 総世帯 (21) -->
  <text x="255" y="116" text-anchor="end" font-size="13" fill="#1d1d1f">世帯年収（総世帯）</text>
  <line x1="270" y1="111" x2="864" y2="111" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="864" cy="111" r="7" fill="#c0392b"/><text x="864" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">21</text>

  <!-- B 勤労者 (21) -->
  <text x="255" y="158" text-anchor="end" font-size="13" fill="#1d1d1f">世帯年収（勤労者世帯）</text>
  <line x1="270" y1="153" x2="864" y2="153" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="864" cy="153" r="7" fill="#c0392b"/><text x="864" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">21</text>

  <!-- C 金融資産残高 (21) -->
  <text x="255" y="200" text-anchor="end" font-size="13" fill="#1d1d1f">金融資産残高（貯蓄）</text>
  <line x1="270" y1="195" x2="864" y2="195" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="864" cy="195" r="7" fill="#c0392b"/><text x="864" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">21</text>

  <!-- D 純金融資産 (20) -->
  <text x="255" y="242" text-anchor="end" font-size="13" fill="#1d1d1f">純金融資産（貯蓄−負債）</text>
  <line x1="270" y1="237" x2="864" y2="237" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="834" cy="237" r="7" fill="#c0392b"/><text x="834" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">20</text>

  <!-- E 消費支出 (20) -->
  <text x="255" y="284" text-anchor="end" font-size="13" fill="#1d1d1f">1か月の消費支出</text>
  <line x1="270" y1="279" x2="864" y2="279" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="834" cy="279" r="7" fill="#c0392b"/><text x="834" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">20</text>

  <!-- divider -->
  <line x1="24" y1="306" x2="876" y2="306" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="24" y="326" font-size="12" font-weight="700" fill="#6b6b70">参考：世帯構成（この2つは「低さ」の言い訳にならない）</text>

  <!-- F 高齢化率 (14 高い順) -->
  <text x="255" y="356" text-anchor="end" font-size="13" fill="#1d1d1f">高齢化率（高い順）</text>
  <line x1="270" y1="351" x2="864" y2="351" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="660" cy="351" r="7" fill="#8a8a90"/><text x="660" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#6b6b70">14</text>
  <text x="680" y="355" font-size="11" fill="#6b6b70">＝むしろ若い方</text>

  <!-- G 世帯の小ささ (5 小さい順=単身多い) -->
  <text x="255" y="398" text-anchor="end" font-size="13" fill="#1d1d1f">世帯の小ささ（単身の多さ）</text>
  <line x1="270" y1="393" x2="864" y2="393" stroke="#d9d9de" stroke-width="2"/>
  <circle cx="390" cy="393" r="7" fill="#8a8a90"/><text x="390" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#6b6b70">5</text>
  <text x="410" y="397" font-size="11" fill="#6b6b70">単身は多めだが中位（最小は東京・大阪で年収は上位）</text>

  <!-- conclusion box -->
  <rect x="24" y="420" width="852" height="122" rx="8" fill="#f2f4f7"/>
  <text x="42" y="448" font-size="14" font-weight="700" fill="#1d1d1f">要因は「世帯構成」ではなく「所得水準そのもの」</text>
  <text x="42" y="472" font-size="13" fill="#1d1d1f">・所得・貯蓄・資産・消費は軒並み最下位。金融資産は唯一1,000万円未満で、横浜との差は約1,203万円。</text>
  <text x="42" y="493" font-size="13" fill="#1d1d1f">・世帯年収と世帯の小ささの相関はほぼゼロ（−0.09）。単身が多い東京・大阪はむしろ高所得。</text>
  <text x="42" y="514" font-size="13" fill="#1d1d1f">・世帯構成から予測される札幌の年収は約591万円。実績475万円で、予測より約116万円低い外れ値。</text>
  <text x="42" y="534" font-size="11" fill="#6b6b70">出典：総務省 令和6年全国家計構造調査／令和2年国勢調査（大都市比較統計年表 令和6年版）</text>
</svg>
